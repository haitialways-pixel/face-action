<script>/* start-screen background: animates only while #start is visible; one static frame with prefers-reduced-motion */
(()=>{const st=document.getElementById('start'),cv=document.getElementById('startBg');if(!st||!cv)return;const g=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)');let W=0,H=0,D=1,raf=0,last=0,T=0;const R=Math.random;
const stars=[],coins=[],sparks=[];let rocks=[];const MAXC=14,MAXS=22;
const coin=a=>({x:R()*W,y:a?R()*H:-20,r:5+R()*5,vy:14+R()*18,vx:(R()-.5)*10,a:R()*6,va:1.5+R()*2.5});
const spark=a=>({x:R()*W,y:a?R()*H:H+10,vy:-(8+R()*16),l:R()*6,r:R()*1.6+.6});
const count=()=>coins.length+sparks.length+stars.length;
function init(){stars.length=coins.length=sparks.length=0;for(let i=0;i<50;i++)stars.push({x:R()*W,y:R()*H*.6,r:R()*1.3+.3,p:R()*6});
 for(let i=0;i<MAXC;i++)coins.push(coin(1));for(let i=0;i<MAXS;i++)sparks.push(spark(1));
 rocks=[];let x=-10;while(x<W+20){const w=18+R()*34,h=(x<W*.22||x>W*.78?60:22)+R()*46;rocks.push([x,w,h]);x+=w*.7}}
function step(dt){for(const c of coins){c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(T+c.a)*.2;c.a+=c.va*dt;if(c.y>H+20)Object.assign(c,coin(0))}
 for(const s of sparks){s.y+=s.vy*dt;s.l+=dt;if(s.y<-10)Object.assign(s,spark(0))}}
function dragon(x,y,s,f){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(8,2,14,.92)';g.strokeStyle='rgba(255,140,40,.35)';g.lineWidth=1.2;
 const w=Math.sin(f)*26;g.beginPath();g.moveTo(-6,0);g.lineTo(-28,-18-w);g.lineTo(-58,-30-w*1.4);g.lineTo(-46,-12-w*.6);g.lineTo(-64,-14-w*.9);g.lineTo(-40,2);g.closePath();
 g.moveTo(6,0);g.lineTo(20,-16-w);g.lineTo(44,-28-w*1.3);g.lineTo(36,-10-w*.6);g.lineTo(50,-10-w*.8);g.lineTo(26,4);g.closePath();g.fill();g.stroke();
 g.beginPath();g.ellipse(0,2,30,8,0,0,7);g.fill();g.beginPath();g.moveTo(26,0);g.quadraticCurveTo(42,-10,52,-6);g.lineTo(62,-4);g.lineTo(52,2);g.quadraticCurveTo(42,4,26,6);g.fill();
 g.beginPath();g.moveTo(-26,2);g.quadraticCurveTo(-50,14,-74,6);g.lineTo(-84,10);g.lineTo(-74,12);g.quadraticCurveTo(-48,22,-24,7);g.fill();
 g.fillStyle='rgba(255,120,30,.9)';g.beginPath();g.arc(56,-5,1.4,0,7);g.fill();g.restore()}
function draw(){g.clearRect(0,0,W,H);
 const mx=W*.84,my=H*.09;let gr=g.createRadialGradient(mx,my,10,mx,my,90);gr.addColorStop(0,'rgba(255,236,200,.28)');gr.addColorStop(1,'rgba(255,236,200,0)');g.fillStyle=gr;g.fillRect(mx-90,my-90,180,180);
 g.fillStyle='#f6e7c8';g.beginPath();g.arc(mx,my,22,0,7);g.fill();g.fillStyle='#24113a';g.beginPath();g.arc(mx+9,my-5,19,0,7);g.fill();
 for(const s of stars){g.globalAlpha=.35+.35*Math.sin(T*1.6+s.p);g.fillStyle='#fff3d6';g.fillRect(s.x,s.y,s.r,s.r)}g.globalAlpha=1;
 const per=22,u=((T+9)%per)/per;dragon(-120+u*(W+240),H*.2+Math.sin(T*.7)*14,Math.min(1.1,W/380),T*5);
 for(const [tx,dir] of [[W*.07,1],[W*.93,-1]]){const ty=H*.6,fl=.8+.2*Math.sin(T*13+tx)+.1*Math.sin(T*7);gr=g.createRadialGradient(tx,ty,4,tx,ty,150*fl);gr.addColorStop(0,'rgba(255,150,40,.45)');gr.addColorStop(1,'rgba(255,90,0,0)');g.fillStyle=gr;g.fillRect(tx-160,ty-160,320,320);
