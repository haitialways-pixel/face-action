function audioUnlock(){

function tone(f,dur,{type='square',vol=.25,slide=0,delay=0,attack=.005}={}){
  const ac=SND.ac;if(!ac||SND.vol<=0||ac.state!=='running')return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,{vol=.3,delay=0,hp=800}={}){const ac=SND.ac;if(!ac||SND.vol<=0||ac.state!=='running')return;
  const t=ac.currentTime+delay,b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(SND.master);s.start(t)}

  power:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.1,{type:'triangle',vol:.18,delay:i*.06})),

let last=performance.now(),running=false;
function step(now){requestAnimationFrame(step);const dt=Math.min(.05,(now-last)/1000);last=now;

function update(dt){
  S.t+=dt;S.stageT+=dt;S.shieldCd-=dt;S.bannerT-=dt;S.comboT-=dt;if(S.comboT<=0)S.combo=0;
  for(const k in S.pw)if((S.pw[k]-=dt)<=0)delete S.pw[k];

    for(const e of S.ents)if(e.t==='g'&&!e.boss){e.dead=true;addScore(10,e.x*W,e.y)}else if(e.boss)e.hpL-=3;}}

  if(mode==='face'&&!faceSeen){ctx.textAlign='center';ctx.fillStyle='#f88';ctx.font='14px sans-serif';ctx.fillText(t('noFace'),W/2,H*.45)}
}
document.documentElement.style.setProperty('--sat','env(safe-area-inset-top)');

// ---------- Start / calibration ----------
const SECURE=window.isSecureContext&&location.protocol!=='file:';
if(!SECURE){setMsg('needHttps',{p:location.protocol})}
async function startFace(){
  if(!SECURE){setMsg('blockedHttps',{p:location.protocol});return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMsg('noCamApi');return}
  setMsg('startingCam');
  if(!await camStart(true))return;
  try{
    const t=setInterval(()=>{msgState=null;$('msg').innerHTML='<small>'+t('loadingModel')+' ('+modelStatus+')</small>'},200);
    await initFace();clearInterval(t);
  }catch(e){setMsg('loadFail',{e:e.message});return}
  mode='face';faceLoopOn=true;faceLoop();$('start').classList.add('hide');if(forceCal||!loadCal())await calibrate();forceCal=false;begin();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// ---------- Camera lifecycle: camera only on while actively playing ----------
let stream=null,camWanted=false;
let prevOn=localStorage.getItem('ftq_prev')!=='0';
function updInd(){video.classList.toggle('off',!prevOn);$('bPrev').classList.toggle('hide',!stream);$('camNote').classList.toggle('hide',!stream||!prevOn);$('camInd').classList.toggle('hide',!stream);$('camResume').classList.toggle('hide',!(camWanted&&!stream&&mode==='face'&&running&&!S.ended&&!paused))}
async function camStart(first){
  if(stream)return true;
  try{
    camStatus='requesting';
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.muted=true;video.setAttribute('playsinline','');video.srcObject=stream;video.classList.remove('hide');
    await video.play();
    if(video.readyState<2)await new Promise(r=>video.addEventListener('loadeddata',r,{once:true}));
    camStatus='playing';camWanted=true;lastVT=-1;
    if(landmarker&&!faceLoopOn){faceLoopOn=true;faceLoop()}
    updInd();return true;
  }catch(e){stream=null;camStatus='error '+e.name;
    if(first)setMsg('camErr',{e:e.name+' '+(e.message||'')});
    updInd();return false}
}
function camStop(){faceLoopOn=false;faceSeen=false;bs={};
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;video.classList.add('hide');if(camStatus==='playing')camStatus='stopped';updInd()}
const camResume=()=>{if(mode==='face'&&camWanted&&running&&!S.ended&&!paused&&!document.hidden)camStart()};
async function sample(ms){const acc={},n={};let y=0,yn=0;const end=performance.now()+ms;while(performance.now()<end){if(faceSeen){for(const k in bs){acc[k]=(acc[k]||0)+bs[k];n[k]=(n[k]||0)+1}y+=yaw;yn++}await wait(40)}const o={};for(const k in acc)o[k]=acc[k]/n[k];o._yaw=yn?y/yn:0;o._n=yn;return o}
const CAL_KEY='ftq_cal_v1';let forceCal=false;
function saveCal(){try{localStorage.setItem(CAL_KEY,JSON.stringify({v:1,base,yaw0,moveSign,moveRange,sens,t:Date.now()}))}catch(e){}}
function loadCal(){try{const c=JSON.parse(localStorage.getItem(CAL_KEY)||'null');if(!c||c.v!==1||!c.base)return false;
  base=c.base;yaw0=c.yaw0||0;moveSign=c.moveSign||1;moveRange=c.moveRange||.25;if(c.sens)sens=c.sens;$('sens').value=sens;return true}catch(e){return false}}
async function calibrate(){
  $('calib').classList.remove('hide');const T=$('cText'),I=$('cIcon');
  I.textContent='😐';calState={text:'findFace'};T.textContent=t('findFace');
  const t0=performance.now();while(!faceSeen&&performance.now()-t0<8000)await wait(100);
  if(!faceSeen){calState={text:'noFaceCal'};T.textContent=t('noFaceCal');await wait(2500)}
  // each step: 3 s with countdown + progress bar
  const STEP=3000;let si=0;const total=5;
  async function stepRun(title,icon,doSample){si++;calState={text:title,step:{i:si,n:total}};T.textContent=t(title);I.textContent=icon;$('cStep').textContent=t('stepOf',calState.step);
    sfx.beep(false);let lastSec=3;const t0=performance.now();const tick=setInterval(()=>{const e=performance.now()-t0;const sec=Math.max(1,Math.ceil((STEP-e)/1000));if(sec<lastSec){lastSec=sec;sfx.beep(false)}$('cBar').style.width=Math.min(100,e/STEP*100)+'%';$('cCount').textContent=Math.max(1,Math.ceil((STEP-e)/1000))},50);
    const r=doSample?await sample(STEP):(await wait(STEP),null);clearInterval(tick);$('cBar').style.width='100%';sfx.beep(true);return r}
  const b=await stepRun('c1','😐',true);yaw0=b._yaw;delete b._yaw;delete b._n;
  for(const k in b)b[k]=Math.min(b[k],.5);base=b; // neutral baseline (capped so a held expression can't disable a gesture)
  const l=await stepRun('c2','👈',true);
  const d=l._yaw-yaw0;if(Math.abs(d)>.05){moveSign=-Math.sign(d);moveRange=Math.min(.4,Math.max(.12,Math.abs(d)*.7))}
  await stepRun('c3','😑');
  await stepRun('c4','😮');
  await stepRun('c5','😁');
  $('cCount').textContent='';$('cStep').textContent='';calState={};
  saveCal();$('calib').classList.add('hide');
}
function begin(){$('start').classList.add('hide');$('bPause').classList.remove('hide');if(mode==='touch')$('touch').classList.remove('hide');newGame();running=true;last=performance.now()}
$('bFace').onclick=startFace;
const HOW_KEY='fa_howto_v1';
function showHow(){$('howto').classList.remove('hide');$('howto').scrollTop=0}
$('bHow').onclick=showHow;$('bHowP').onclick=showHow;
$('bHowOk').onclick=()=>{localStorage.setItem(HOW_KEY,'1');$('howto').classList.add('hide')};
if(!localStorage.getItem(HOW_KEY))showHow();
function doPause(){if(!running||S.ended||paused)return;paused=true;camStop();$('pause').classList.remove('hide')}
$('bPause').onclick=doPause;
$('bResume').onclick=()=>{$('pause').classList.add('hide');paused=false;last=performance.now();camResume()};
$('bVol').textContent=volIcon();$('bVol').onclick=e=>{e.stopPropagation();cycleVol();sfx.beep(true)};
const sl=$('sens');sl.value=sens;sl.oninput=()=>{sens=+sl.value;localStorage.setItem('ftq_sens',sens);if(localStorage.getItem(CAL_KEY))saveCal()};
function syncHud(){$('sensBox').classList.toggle('hide',!hudOn)}syncHud();
$('bHud').onclick=()=>{hudOn=!hudOn;localStorage.setItem('ftq_hud',hudOn?'1':'0');syncHud()};
$('bRecalStart').onclick=()=>{forceCal=true;startFace()};
$('bRecalAuto').onclick=async()=>{$('bRecalAuto').classList.add('hide');noFaceT=0;paused=true;await calibrate();paused=false;last=performance.now()};
$('bRecal').onclick=async()=>{if(mode!=='face')return;paused=true;await calibrate();paused=false;last=performance.now()};
$('bTouch').onclick=()=>{mode='touch';begin()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){camStop();if(running)paused=true}else{if($('rest').classList.contains('hide')&&$('calib').classList.contains('hide')&&$('pause').classList.contains('hide'))paused=false;last=performance.now();camResume()}updInd()});
addEventListener('pagehide',camStop);addEventListener('pageshow',e=>{if(e.persisted)camResume()});
$('camResume').onclick=()=>camStart();
$('bPrev').onclick=()=>{prevOn=!prevOn;localStorage.setItem('ftq_prev',prevOn?'1':'0');updInd()};
newGame();requestAnimationFrame(step);
window.__ft={sfx,SND,startRest,endRest,gameOver,get stream(){return stream},get S(){return S},begin,inp,update,draw,get bs(){return bs},get st(){return {camStatus,modelStatus,faceSeen,faceFps,mode}}};
</script></body></html>
