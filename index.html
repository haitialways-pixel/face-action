<script>/* start-screen background: animates only while #start is visible; one static frame with prefers-reduced-motion */
(()=>{const st=document.getElementById('start'),cv=document.getElementById('startBg');if(!st||!cv)return;const g=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)');let W=0,H=0,D=1,raf=0,last=0,T=0;const R=Math.random;
const stars=[],coins=[],sparks=[];let rocks=[];const MAXC=14,MAXS=22;
const coin=a=>({x:R()*W,y:a?R()*H:-20,r:5+R()*5,vy:14+R()*18,vx:(R()-.5)*10,a:R()*6,va:1.5+R()*2.5});
const spark=a=>({x:R()*W,y:a?R()*H:H+10,vy:-(8+R()*16),l:R()*6,r:R()*1.6+.6});
const count=()=>coins.length+sparks.length+stars.length;
function init(){stars.length=coins.length=sparks.length=0;for(let i=0;i<50;i++)stars.push({x:R()*W,y:R()*H*.6,r:R()*1.3+.3,p:R()*6});
 for(let i=0;i<MAXC;i++)coins.push(coin(1));for(let i=0;i<MAXS;i++)sparks.push(spark(1));
 rocks=[];let x=-10;while(x<W+20){const w=18+R()*34,h=(x<W*.22||x>W*.78?60:22)+R()*46;rocks.push([x,w,h]);x+=w*.7}}
function step(dt){for(const c of coins){c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(T+c.a)*.2;c.a+=c.va*dt;if(c.y>H+20)Object.assign(c,coin(0))}
 for(const s of sparks){s.y+=s.vy*dt;s.l+=dt;if(s.y<-10)Object.assign(s,spark(0))}}
function dragon(x,y,s,f){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(8,2,14,.92)';g.strokeStyle='rgba(255,140,40,.35)';g.lineWidth=1.2;
 const w=Math.sin(f)*26;g.beginPath();g.moveTo(-6,0);g.lineTo(-28,-18-w);g.lineTo(-58,-30-w*1.4);g.lineTo(-46,-12-w*.6);g.lineTo(-64,-14-w*.9);g.lineTo(-40,2);g.closePath();
 g.moveTo(6,0);g.lineTo(20,-16-w);g.lineTo(44,-28-w*1.3);g.lineTo(36,-10-w*.6);g.lineTo(50,-10-w*.8);g.lineTo(26,4);g.closePath();g.fill();g.stroke();
 g.beginPath();g.ellipse(0,2,30,8,0,0,7);g.fill();g.beginPath();g.moveTo(26,0);g.quadraticCurveTo(42,-10,52,-6);g.lineTo(62,-4);g.lineTo(52,2);g.quadraticCurveTo(42,4,26,6);g.fill();
 g.beginPath();g.moveTo(-26,2);g.quadraticCurveTo(-50,14,-74,6);g.lineTo(-84,10);g.lineTo(-74,12);g.quadraticCurveTo(-48,22,-24,7);g.fill();
 g.fillStyle='rgba(255,120,30,.9)';g.beginPath();g.arc(56,-5,1.4,0,7);g.fill();g.restore()}
function draw(){g.clearRect(0,0,W,H);
 const mx=W*.84,my=H*.09;let gr=g.createRadialGradient(mx,my,10,mx,my,90);gr.addColorStop(0,'rgba(255,236,200,.28)');gr.addColorStop(1,'rgba(255,236,200,0)');g.fillStyle=gr;g.fillRect(mx-90,my-90,180,180);
 g.fillStyle='#f6e7c8';g.beginPath();g.arc(mx,my,22,0,7);g.fill();g.fillStyle='#24113a';g.beginPath();g.arc(mx+9,my-5,19,0,7);g.fill();
 for(const s of stars){g.globalAlpha=.35+.35*Math.sin(T*1.6+s.p);g.fillStyle='#fff3d6';g.fillRect(s.x,s.y,s.r,s.r)}g.globalAlpha=1;
 const per=22,u=((T+9)%per)/per;dragon(-120+u*(W+240),H*.2+Math.sin(T*.7)*14,Math.min(1.1,W/380),T*5);
 for(const [tx,dir] of [[W*.07,1],[W*.93,-1]]){const ty=H*.6,fl=.8+.2*Math.sin(T*13+tx)+.1*Math.sin(T*7);gr=g.createRadialGradient(tx,ty,4,tx,ty,150*fl);gr.addColorStop(0,'rgba(255,150,40,.45)');gr.addColorStop(1,'rgba(255,90,0,0)');g.fillStyle=gr;g.fillRect(tx-160,ty-160,320,320);
  g.fillStyle='#3a220f';g.fillRect(tx-3,ty,6,30);g.fillStyle='#ffb347';g.beginPath();g.moveTo(tx-7,ty);g.quadraticCurveTo(tx,ty-26*fl,tx+7*dir*.2+7,ty);g.fill();g.fillStyle='#fff1a8';g.beginPath();g.ellipse(tx,ty-5,2.5,6*fl,0,0,7);g.fill()}
 for(const s of sparks){const a=.5+.5*Math.sin(s.l*5);g.fillStyle='rgba(255,220,120,'+a.toFixed(2)+')';const r=s.r*(1+a);g.beginPath();g.moveTo(s.x,s.y-r*2);g.lineTo(s.x+r*.5,s.y);g.lineTo(s.x,s.y+r*2);g.lineTo(s.x-r*.5,s.y);g.closePath();g.fill();g.fillRect(s.x-r*1.6,s.y-.4,r*3.2,.8)}
 for(const c of coins){const w=Math.max(.8,c.r*Math.abs(Math.cos(c.a)));g.fillStyle='#b8860b';g.beginPath();g.ellipse(c.x,c.y,w,c.r,0,0,7);g.fill();g.fillStyle='#ffd54a';g.beginPath();g.ellipse(c.x-w*.12,c.y,w*.78,c.r*.8,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.7)';g.fillRect(c.x-w*.3,c.y-c.r*.5,Math.max(.6,w*.25),c.r*.4)}
 g.fillStyle='#05010a';g.beginPath();g.moveTo(-10,H+10);for(const [x,w,h] of rocks){g.lineTo(x,H-h*.35);g.lineTo(x+w*.5,H-h);g.lineTo(x+w,H-h*.3)}g.lineTo(W+10,H+10);g.closePath();g.fill()}

function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D|0;cv.height=H*D|0;g.setTransform(D,0,0,D,0,0);init()}
function frame(ts){raf=0;if(st.classList.contains('hide')||document.hidden)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;T+=dt;step(dt);draw();raf=requestAnimationFrame(frame)}
function kick(){if(st.classList.contains('hide'))return;if(RM.matches){draw();return}if(!raf){last=0;raf=requestAnimationFrame(frame)}}
new MutationObserver(kick).observe(st,{attributes:true,attributeFilter:['class']});document.addEventListener('visibilitychange',kick);
addEventListener('resize',()=>{size();draw()});RM.addEventListener&&RM.addEventListener('change',kick);size();draw();kick();
window.__startBg={get running(){return !!raf},get count(){return typeof count==='function'?count():0}};})();
</script>

  if(frozen)return; // new-record moment: everything holds still for ~1 s
  S.stageT+=dt;S.shieldCd-=dt;S.comboT-=dt;if(S.comboT<=0)S.combo=0;
  for(const k in S.pw)if((S.pw[k]-=dt)<=0)delete S.pw[k];
  const d=diff(S.stage),slow=S.pw.slow?.5:1;
  S.x=Math.max(.06,Math.min(.94,S.x+inp.x*dt*0.9));
  const px=S.x*W,py=H*0.78;

  if(inp.special){inp.special=false;if(S.special>=100){S.special=0;sfx.nova();fx(px,py-60,t('nova'),'#ffd54a',22);screenFlash('#ffd54a',.35,.3);S.shake=.25;ev('nova');
    for(const e of S.ents)if(e.t==='g'&&!e.boss){e.dead=true;addScore(10,e.x*W,e.y);ev('kill')}else if(e.boss)e.hpL-=3;}}

        if(e.hpL<=0){e.dead=true;S.kills++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);sfx.kill();ev('kill');ev('combo',S.combo);
          if(S.combo>=5&&S.combo%5===0)hypeCombo(S.combo);
          S.comboT=3;S.special=Math.min(100,S.special+8);addScore((e.boss?150:10)*(1+Math.min(S.combo,10)*0.1),ex,e.y);
          if(e.boss){ev('boss');bossCelebrate(ex,e.y)}}}
      if(!e.dead&&e.y>py-20&&Math.abs(ex-px)<40){e.dead=true;hurt()}
      if(e.y>H+30){e.dead=true}
    }else{
      if(Math.hypot(ex-px,e.y-py)<(vac?60:38)){e.dead=true;
        if(e.t==='t'){const guarded=S.ents.some(o=>o.t==='g'&&!o.dead&&!o.boss&&Math.abs(o.y-e.y)<120&&Math.abs(o.x-e.x)<.2);
          const mult=1+Math.min(S.combo,10)*0.1;addScore(e.p*mult*(guarded?0.5:1),ex,e.y);sfx.treasure(e.p);S.special=Math.min(100,S.special+3);ev('treasure');

        else powerup(e.k,ex,e.y)}

    if(S.offer||S.ended)return;
  }

}

function shapePath(kind,x,y,r){ctx.beginPath();

 else if(kind==='diamond'){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath()}
 else if(kind==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}

 if(OPT.cb){ctx.lineWidth=2.5;ctx.strokeStyle='#000';shapePath(kind,x,y,r+Math.max(3,r*.18)/2+1.5);ctx.stroke()} // high-contrast outline
 ctx.restore()}

function cbMark(kind,x,y,r){if(!OPT.cb)return;ctx.save();ctx.font='bold '+Math.round(r*.62)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.fillStyle='#fff';

function drawEnt(e){const x=e.x*W,y=e.y,u=U();let label,emoji=e.e;
 ctx.globalAlpha=e.phase?(Math.sin(e.ph*2)>-.2?1:.35):1;
 if(e.t==='g'){const disguised=e.mimic&&e.y<H*.4;const r=u*(e.boss?40:22);
   if(disguised){shape('star',x,y,r,TCOL[20],'#fff');emoji='🏺';label='$';cbMark('t',x,y,r)}
   else{const[c,l]=COL[e.id];shape('spike',x,y,r,c,'#ffffff');label=l;cbMark('g',x,y,r)}
   if(e.hpL>1){ctx.fillStyle='#fff';ctx.font='bold '+Math.round(u*12)+'px sans-serif';ctx.fillText(t('hp')+' '+e.hpL,x,y+r+u*12)}}
 else if(e.t==='t'){const r=u*(14+e.p/10);shape(e.p>=70?'diamond':'star',x,y,r,TCOL[e.p],'#ffffff');label=e.p;cbMark('t',x,y,r)}
 else{const[c,l]=COL[e.k];shape('square',x,y,u*16,c,'#ffffff');label=l;cbMark('p',x,y,u*16)}

  I.textContent='😐';calState={text:'findFace'};T.textContent=t('findFace');
  const t0=performance.now();while(!faceSeen&&performance.now()-t0<8000)await wait(100);
  if(!faceSeen){calState={text:'noFaceCal'};T.textContent=t('noFaceCal');await wait(2500)}
  // each step: 3 s with countdown + progress bar
  const STEP=3000;let si=0;const total=5;
  async function stepRun(title,icon,doSample){si++;calState={text:title,step:{i:si,n:total}};T.textContent=t(title);I.textContent=icon;$('cStep').textContent=t('stepOf',calState.step);
    sfx.beep(false);let lastSec=3;const t0=performance.now();const tick=setInterval(()=>{const e=performance.now()-t0;const sec=Math.max(1,Math.ceil((STEP-e)/1000));if(sec<lastSec){lastSec=sec;sfx.beep(false)}$('cBar').style.width=Math.min(100,e/STEP*100)+'%';$('cCount').textContent=Math.max(1,Math.ceil((STEP-e)/1000))},50);
    const r=doSample?await sample(STEP):(await wait(STEP),null);clearInterval(tick);$('cBar').style.width='100%';sfx.beep(true);return r}
  const b=await stepRun('c1','😐',true);yaw0=b._yaw;delete b._yaw;delete b._n;
  for(const k in b)b[k]=Math.min(b[k],.5);base=b; // neutral baseline (capped so a held expression can't disable a gesture)
  const l=await stepRun('c2','👈',true);
  const d=l._yaw-yaw0;if(Math.abs(d)>.05){moveSign=-Math.sign(d);moveRange=Math.min(.4,Math.max(.12,Math.abs(d)*.7))}
  await stepRun('c3','😑');
  await stepRun('c4','😮');
  await stepRun('c5','😁');
  $('cCount').textContent='';$('cStep').textContent='';calState={};
  saveCal();lightWatch(false);$('calib').classList.add('hide');
}
